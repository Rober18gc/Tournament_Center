<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Usuario</title>
<link rel="stylesheet" href="{{ url_for('static', filename='formusuario.css') }}">
<script src="{{ url_for('static', filename='formusuario.js') }}" defer></script>
</head>

<body>

<div class="contenedor-principal">

    <!-- IZQUIERDA: IMAGEN -->
    <div class="lado-izquierdo">
        <img src="{{ url_for('static', filename='imagenes/Logo.png') }}" alt="Logo" class="logo-form">
    </div>

    <!-- DERECHA: FORMULARIO -->
    <div class="lado-derecho">
        <h2>Registro de Usuario</h2>
        <div id="avisoFormUsuario"></div>
        <form id="formRegistro">

            <div class="zonaNombre">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre" required>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Apellidos" required>
                </div>
            </div>

            <div class="zonafechaemail">
                <div class="campo">
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha_nacimiento" required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                </div>
            </div>

            <div class="zonausuario">
                <div class="campo">
                    <label for="nombre_usuario">Nombre de usuario</label>
                    <input type="text" id="nombre_usuario" placeholder="Nombre de usuario" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
            </div>

            <div class="zonaboton">
                <button type="submit">Crear usuario</button>
                <button type="button" onclick="volver()">Volver</button>
            </div>
        </form>
    </div>

</div>

</body>
</html>
